<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Museo D'Amore - Um lugar especial para guardar nossas memórias.">
    <title>Museo D'Amore - Peleco e Melequinha</title>
    
    <!-- Favicon (Coração) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💖</text></svg>">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Indie+Flower&family=Patrick+Hand&family=Dancing+Script:wght@600&family=Parisienne&display=swap" rel="stylesheet">

    <!-- Import Map para React e Lucide -->
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.344.0"
      }
    }
    </script>

    <!-- Babel para JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* Estilos Globais e Animações Personalizadas */
        body {
            font-family: 'Patrick Hand', cursive;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background-color: #f8fafc;
        }
        
        /* Ocultar barra de rolagem */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Animações */
        @keyframes float { 0% { transform: translateY(0px) rotate(0deg); opacity: 0; } 50% { opacity: 0.5; } 100% { transform: translateY(-100px) rotate(20deg); opacity: 0; } }
        @keyframes swim { 0% { transform: translateX(0) rotate(0deg); opacity: 0; } 20% { opacity: 0.4; } 80% { opacity: 0.4; } 100% { transform: translateX(120vw) rotate(10deg); opacity: 0; } }
        @keyframes swim-across { 0% { transform: translateX(120vw); } 100% { transform: translateX(-120vw); } }
        @keyframes peek-up { 0%, 100% { transform: translateY(100%); } 50% { transform: translateY(0); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        
        .animate-float { animation: float linear infinite; }
        .animate-swim { animation: swim linear infinite; }
        .animate-swim-across { animation: swim-across linear infinite; }
        .animate-peek-up { animation: peek-up ease-in-out infinite; }
        .animate-fade-in-up { animation: fadeInUp 0.8s ease-out; }
        .animate-bounce-slow { animation: bounce 3s infinite; }
        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        // Removido 'PawPrint' da importação para evitar o erro, pois estamos usando o CustomPawPrint
        import { Moon, Heart, Trash2, Edit2, X, Image as ImageIcon, Save, StickyNote, Mail, Camera, Anchor, Leaf, Sparkles, Fish, Calendar, ChevronLeft, ChevronRight, PlusCircle } from 'lucide-react';

        const fonts = {
            hand: { fontFamily: '"Patrick Hand", cursive' },
            title: { fontFamily: '"Indie Flower", cursive' },
            script: { fontFamily: '"Dancing Script", cursive' },
            romantic: { fontFamily: '"Parisienne", cursive' },
        };

        // --- Componente Customizado Patinha (Substituindo PawPrint da biblioteca para evitar erros de versão) ---
        const CustomPawPrint = ({ className, size = 24 }) => (
            <svg 
                xmlns="http://www.w3.org/2000/svg" 
                width={size} 
                height={size} 
                viewBox="0 0 24 24" 
                fill="currentColor" 
                stroke="currentColor" 
                strokeWidth="2" 
                strokeLinecap="round" 
                strokeLinejoin="round" 
                className={className}
            >
                <circle cx="12" cy="16.5" r="4.5" />
                <circle cx="4.5" cy="10.5" r="2.5" />
                <circle cx="9.5" cy="7.5" r="2.5" />
                <circle cx="14.5" cy="7.5" r="2.5" />
                <circle cx="19.5" cy="10.5" r="2.5" />
            </svg>
        );

        // --- Componente do Temporizador (Dias no Coração) ---
        const LoveTimer = () => {
            const [days, setDays] = useState(0);

            useEffect(() => {
                const startDate = new Date('2023-08-02T00:00:00');
                const updateTimer = () => {
                    const now = new Date();
                    const diff = now - startDate;
                    setDays(Math.floor(diff / (1000 * 60 * 60 * 24)));
                };
                
                updateTimer();
                const interval = setInterval(updateTimer, 1000 * 60 * 60);
                return () => clearInterval(interval);
            }, []);

            return (
                <div className="relative group animate-float scale-90 md:scale-100" style={{ animationDuration: '6s' }}>
                    <svg width="180" height="160" viewBox="0 0 100 100" className="drop-shadow-[0_0_15px_rgba(251,113,133,0.6)] md:w-[200px] md:h-[180px]">
                        <defs>
                        <linearGradient id="heartGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style={{ stopColor: '#fb7185', stopOpacity: 0.8 }} />
                            <stop offset="100%" style={{ stopColor: '#e11d48', stopOpacity: 0.9 }} />
                        </linearGradient>
                        <filter id="glow">
                            <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
                            <feMerge>
                            <feMergeNode in="coloredBlur"/>
                            <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                        </defs>
                        <path 
                        d="M50,88.9C25.5,74.6,5,55,5,34.5C5,18.4,17.2,5,32.5,5c8.6,0,16.2,4.4,20.8,11.2C56,10.6,63.1,5.5,71.2,5.5c13.7,0,24.3,11.3,24.3,26.5 c0,20.3-19.4,40.6-45.5,56.9" 
                        fill="url(#heartGradient)" 
                        stroke="white" 
                        strokeWidth="1.5"
                        filter="url(#glow)"
                        className="opacity-90"
                        />
                        <path d="M20,30 Q35,15 50,25" fill="none" stroke="white" strokeWidth="2" strokeOpacity="0.4" strokeLinecap="round" />
                    </svg>
                    <div className="absolute inset-0 flex flex-col items-center justify-center text-white pt-2" style={fonts.hand}>
                        <span className="text-4xl md:text-5xl font-bold drop-shadow-md leading-none">{days}</span>
                        <span className="text-xs md:text-sm uppercase tracking-widest font-semibold mt-1">Dias Juntos</span>
                    </div>
                </div>
            );
        };

        // --- Mini Animais Fofinhos (SVG Components) ---
        const MiniJellyfish = ({ className }) => (
            <svg viewBox="0 0 100 100" className={`w-12 h-12 md:w-16 md:h-16 text-white drop-shadow-lg ${className}`}>
                <path d="M20,45 C20,15 80,15 80,45 C80,60 70,65 50,65 C30,65 20,60 20,45 Z" fill="currentColor" opacity="0.9" />
                <circle cx="35" cy="30" r="3" fill="white" opacity="0.6" />
                <circle cx="65" cy="35" r="2" fill="white" opacity="0.6" />
                <path d="M30,65 Q25,75 30,85" fill="none" stroke="currentColor" strokeWidth="4" strokeLinecap="round" className="animate-pulse"/>
                <path d="M50,65 Q50,80 50,85" fill="none" stroke="currentColor" strokeWidth="4" strokeLinecap="round" className="animate-pulse delay-100"/>
                <path d="M70,65 Q75,75 70,85" fill="none" stroke="currentColor" strokeWidth="4" strokeLinecap="round" className="animate-pulse delay-200"/>
                <circle cx="38" cy="48" r="3" fill="#1e293b" />
                <circle cx="62" cy="48" r="3" fill="#1e293b" />
                <path d="M47,53 Q50,56 53,53" fill="none" stroke="#1e293b" strokeWidth="2" strokeLinecap="round"/>
                <circle cx="30" cy="52" r="2" fill="#fb7185" opacity="0.6" />
                <circle cx="70" cy="52" r="2" fill="#fb7185" opacity="0.6" />
            </svg>
        );

        const CuteCrab = ({ className, style }) => (
            <svg viewBox="0 0 100 60" className={`w-10 h-6 md:w-12 md:h-8 text-rose-400 ${className}`} style={style}>
                <path d="M20,30 Q10,10 30,25" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round"/>
                <path d="M80,30 Q90,10 70,25" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round"/>
                <ellipse cx="50" cy="40" rx="30" ry="18" fill="currentColor" />
                <circle cx="40" cy="35" r="3" fill="white" />
                <circle cx="40" cy="35" r="1" fill="black" />
                <circle cx="60" cy="35" r="3" fill="white" />
                <circle cx="60" cy="35" r="1" fill="black" />
                <path d="M25,45 L15,50" stroke="currentColor" strokeWidth="2" />
                <path d="M25,50 L15,55" stroke="currentColor" strokeWidth="2" />
                <path d="M75,45 L85,50" stroke="currentColor" strokeWidth="2" />
                <path d="M75,50 L85,55" stroke="currentColor" strokeWidth="2" />
            </svg>
        );

        const CuteStarfish = ({ className, style }) => (
            <svg viewBox="0 0 100 100" className={`w-8 h-8 md:w-10 md:h-10 text-yellow-300 ${className}`} style={style}>
                <path d="M50,10 L60,35 L90,35 L65,55 L75,85 L50,65 L25,85 L35,55 L10,35 L40,35 Z" fill="currentColor" stroke="#fcd34d" strokeWidth="2" strokeLinejoin="round"/>
                <circle cx="45" cy="45" r="2" fill="black" opacity="0.7"/>
                <circle cx="55" cy="45" r="2" fill="black" opacity="0.7"/>
                <path d="M48,52 Q50,55 52,52" fill="none" stroke="black" strokeWidth="1" />
            </svg>
        );

        const CuteTurtle = ({ className, style }) => (
            <svg viewBox="0 0 100 60" className={`w-16 h-10 md:w-20 md:h-12 text-green-400 ${className}`} style={style}>
                <path d="M20,40 Q20,10 80,40 Z" fill="#4ade80" stroke="#166534" strokeWidth="2"/>
                <path d="M35,40 Q35,20 65,40" fill="none" stroke="#166534" strokeWidth="1" strokeDasharray="2,2"/>
                <circle cx="85" cy="40" r="8" fill="#86efac" stroke="#166534" strokeWidth="2"/>
                <circle cx="87" cy="38" r="1" fill="black"/>
                <ellipse cx="30" cy="45" rx="8" ry="4" fill="#86efac" transform="rotate(20 30 45)" stroke="#166534"/>
                <ellipse cx="70" cy="45" rx="8" ry="4" fill="#86efac" transform="rotate(-20 70 45)" stroke="#166534"/>
            </svg>
        );

        // --- Avatares Principais ---
        const Avatar = ({ type, name, size = "w-24 h-24 md:w-36 md:h-36" }) => {
            return (
                <div className="flex flex-col items-center group cursor-pointer hover:scale-105 transition-transform duration-500 relative z-20">
                <div className={`${size} bg-white/90 backdrop-blur rounded-full flex items-center justify-center shadow-[0_0_25px_rgba(255,255,255,0.6)] border-4 border-white/80 relative overflow-hidden`}>
                    {type === 'jellyfish' ? (
                    <svg viewBox="0 0 100 100" className="w-3/4 h-3/4 text-blue-400 fill-current drop-shadow-md">
                        <path d="M20,45 C20,15 80,15 80,45 C80,60 70,65 50,65 C30,65 20,60 20,45 Z" className="opacity-90" />
                        <circle cx="35" cy="30" r="3" fill="white" opacity="0.6" />
                        <circle cx="65" cy="35" r="2" fill="white" opacity="0.6" />
                        <path d="M30,65 Q25,85 30,100" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" className="animate-pulse"/>
                        <path d="M42,65 Q47,85 42,98" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" className="animate-pulse delay-75"/>
                        <path d="M58,65 Q53,85 58,98" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" className="animate-pulse delay-150"/>
                        <path d="M70,65 Q75,85 70,100" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" className="animate-pulse delay-200"/>
                        <circle cx="38" cy="48" r="3" fill="#1e293b" />
                        <circle cx="62" cy="48" r="3" fill="#1e293b" />
                        <path d="M47,55 Q50,58 53,55" fill="none" stroke="#1e293b" strokeWidth="2" strokeLinecap="round"/>
                        <circle cx="30" cy="52" r="3" fill="#fb7185" opacity="0.6" />
                        <circle cx="70" cy="52" r="3" fill="#fb7185" opacity="0.6" />
                    </svg>
                    ) : (
                    <svg viewBox="0 0 100 100" className="w-3/4 h-3/4 drop-shadow-md">
                        <path d="M15,15 L35,45 L5,40 Z" fill="#fb923c" stroke="#f97316" strokeWidth="2" strokeLinejoin="round" />
                        <path d="M85,15 L65,45 L95,40 Z" fill="#fb923c" stroke="#f97316" strokeWidth="2" strokeLinejoin="round" />
                        <path d="M20,25 L30,42 L12,40 Z" fill="#fed7aa" />
                        <path d="M80,25 L70,42 L88,40 Z" fill="#fed7aa" />
                        <path d="M50,85 C25,85 10,60 10,40 C10,25 30,20 50,20 C70,20 90,25 90,40 C90,60 75,85 50,85 Z" fill="#fb923c" stroke="#f97316" strokeWidth="2" />
                        <path d="M50,83 C70,83 88,65 88,45 C88,38 80,45 50,55 C20,45 12,38 12,45 C12,65 30,83 50,83 Z" fill="#fff7ed" />
                        <circle cx="35" cy="48" r="5" fill="#1e293b" />
                        <circle cx="33" cy="46" r="1.5" fill="white" />
                        <circle cx="65" cy="48" r="5" fill="#1e293b" />
                        <circle cx="63" cy="46" r="1.5" fill="white" />
                        <ellipse cx="50" cy="62" rx="4" ry="3" fill="#1e293b" />
                        <path d="M45,68 Q50,71 55,68" fill="none" stroke="#1e293b" strokeWidth="2" strokeLinecap="round" />
                        <ellipse cx="25" cy="55" rx="5" ry="3" fill="#fda4af" opacity="0.6" />
                        <ellipse cx="75" cy="55" rx="5" ry="3" fill="#fda4af" opacity="0.6" />
                    </svg>
                    )}
                </div>
                <span className="mt-4 text-lg md:text-xl font-bold text-white drop-shadow-[0_2px_2px_rgba(0,0,0,0.3)]" style={fonts.romantic}>{name}</span>
                </div>
            );
        };

        // --- Elementos de Fundo Animados ---
        const BackgroundElements = () => (
            <div className="absolute inset-0 overflow-hidden pointer-events-none">
                {[...Array(15)].map((_, i) => {
                    const size = Math.random() * 40 + 10;
                    const isSparkle = i % 3 === 0;
                    return (
                    <div key={i} className={`absolute animate-float opacity-40 ${isSparkle ? 'text-yellow-200' : 'bg-white/20 rounded-full'}`}
                            style={{
                                width: isSparkle ? 'auto' : size + 'px',
                                height: isSparkle ? 'auto' : size + 'px',
                                left: Math.random() * 100 + '%',
                                bottom: -50,
                                animationDuration: Math.random() * 15 + 10 + 's',
                                animationDelay: Math.random() * 5 + 's'
                            }}>
                        {isSparkle && <Sparkles size={size} />}
                    </div>
                    )
                })}
                {[...Array(5)].map((_, i) => (
                    <div key={`fish-${i}`} className="absolute animate-swim opacity-30 text-blue-200"
                        style={{
                            top: Math.random() * 60 + 20 + '%',
                            left: -50,
                            animationDuration: Math.random() * 20 + 15 + 's',
                            animationDelay: Math.random() * 10 + 's'
                        }}>
                        <Fish size={Math.random() * 30 + 20} />
                    </div>
                ))}
                <div className="absolute bottom-0 left-10 opacity-10 text-blue-100"><svg width="200" height="200" viewBox="0 0 100 100" fill="currentColor"><path d="M10,100 C10,80 30,60 30,40 C30,20 50,10 70,30 C80,40 90,60 90,100 Z" /></svg></div>
                <div className="absolute bottom-10 right-20 opacity-10 text-purple-100"><svg width="150" height="150" viewBox="0 0 100 100" fill="currentColor"><path d="M90,100 C90,70 70,50 60,30 C50,10 30,20 10,40 C20,60 30,80 30,100 Z" /></svg></div>
            </div>
        );

        // --- Cards & Components ---
        const CardRenderer = ({ item, onEdit, onDelete }) => {
            const actions = (
                <div className="absolute top-2 left-2 flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity z-20">
                <button onClick={() => onEdit(item)} className="p-1.5 bg-white rounded-full shadow hover:text-blue-600"><Edit2 size={12} /></button>
                <button onClick={() => onDelete(item.id)} className="p-1.5 bg-white rounded-full shadow hover:text-red-500"><Trash2 size={12} /></button>
                </div>
            );
            
            if (item.type === 'letter') {
                return (
                    <div className="bg-[#fffdf0] p-6 shadow-md relative max-w-sm mx-auto group hover:-translate-y-2 transition-transform duration-300 w-full">
                        <div className="absolute inset-0 pointer-events-none" style={{ backgroundImage: 'repeating-linear-gradient(transparent, transparent 31px, #94a3b8 31px, #94a3b8 32px)', marginTop: '3rem' }} />
                        <div className="absolute top-0 right-0 border-t-[30px] border-r-[30px] border-t-slate-100/50 border-r-slate-300 shadow-sm"></div>
                        <div className="relative z-10">
                        <div className="flex justify-between items-center mb-6 border-b-2 border-red-100 pb-2">
                            <span className="text-red-400 text-xs tracking-widest uppercase font-bold">De: {item.author || 'Nós'}</span>
                            <span className="text-slate-400 text-xs" style={fonts.hand}>{item.date}</span>
                        </div>
                        <h3 className="text-2xl text-slate-800 mb-2 font-bold leading-none" style={fonts.script}>{item.title}</h3>
                        <div className="leading-8 text-slate-700 text-lg min-h-[150px] whitespace-pre-wrap" style={fonts.hand}>{item.description}</div>
                        <div className="mt-4 flex justify-end"><span className="text-3xl animate-bounce">{item.sticker}</span></div>
                        </div>
                        {actions}
                    </div>
                )
            }
            
            if (item.type === 'postit') {
                return (
                    <div className="aspect-square p-6 shadow-lg relative group hover:scale-110 transition-transform duration-300 max-w-[280px] w-full mx-auto flex flex-col justify-center items-center text-center" style={{ backgroundColor: item.color || '#fef3c7' }}>
                        <div className="absolute -top-3 left-1/2 -translate-x-1/2 w-24 h-8 bg-white/40 backdrop-blur-sm rotate-2 shadow-sm border-l border-r border-white/60"></div>
                        <h3 className="text-xl font-bold text-slate-800/80 mb-2 leading-tight" style={fonts.hand}>{item.title}</h3>
                        <p className="text-slate-700 font-medium text-lg leading-relaxed" style={fonts.hand}>{item.description}</p>
                        <div className="mt-4 text-xs text-slate-500 font-bold uppercase tracking-wide">{item.date}</div>
                        <div className="absolute bottom-2 right-2 text-2xl opacity-50 group-hover:opacity-100">{item.sticker}</div>
                        {actions}
                    </div>
                )
            }

            // Polaroid Default
            return (
                <div className="bg-white p-3 pb-8 shadow-xl rotate-1 hover:rotate-0 transition-all duration-300 transform hover:scale-105 relative group max-w-sm mx-auto w-full">
                    <div className="aspect-square bg-slate-100 mb-4 overflow-hidden border border-slate-200">
                    {item.image ? <img src={item.image} alt="Memória" className="w-full h-full object-cover" /> : <div className="w-full h-full flex items-center justify-center text-slate-300"><ImageIcon size={48} /></div>}
                    </div>
                    <div className="text-center px-2">
                    <h3 className="font-bold text-slate-800 text-xl mb-1" style={fonts.hand}>{item.title}</h3>
                    <p className="text-sm text-slate-500" style={fonts.hand}>{item.date}</p>
                    </div>
                    <div className="absolute -top-3 -right-3 text-3xl drop-shadow-md rotate-12">{item.sticker}</div>
                    {actions}
                </div>
            );
        };

        const MemoryModal = ({ isOpen, onClose, onSave, editingItem }) => {
            const [formData, setFormData] = useState({ title: '', date: '', description: '', image: '', category: 'past', sticker: '💙', type: 'photo', color: '#fef3c7', author: 'Lara' });

            useEffect(() => {
                if (editingItem) setFormData(editingItem);
                else setFormData({ title: '', date: new Date().toISOString().split('T')[0], description: '', image: '', category: 'past', sticker: '💙', type: 'photo', color: '#fef3c7', author: 'Lara' });
            }, [editingItem, isOpen]);

            if (!isOpen) return null;
            const handleImageUpload = (e) => { const file = e.target.files[0]; if (file) { const reader = new FileReader(); reader.onloadend = () => setFormData(prev => ({ ...prev, image: reader.result })); reader.readAsDataURL(file); } };
            const colors = ['#fef3c7', '#dcfce7', '#dbeafe', '#fce7f3', '#e0e7ff'];

            return (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                <div className="bg-white w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden animate-fade-in max-h-[90vh] flex flex-col">
                    <div className="bg-indigo-50 p-4 border-b border-indigo-100 flex justify-between items-center shrink-0">
                        <h2 className="text-xl font-bold text-indigo-900" style={fonts.title}>{editingItem ? 'Editar Lembrança' : 'Nova Memória'}</h2>
                        <button onClick={onClose}><X size={20} className="text-indigo-400" /></button>
                    </div>
                    <div className="p-6 space-y-4 overflow-y-auto" style={fonts.hand}>
                        <div className="grid grid-cols-3 gap-2 mb-4">
                            {[{ id: 'photo', icon: Camera, label: 'Foto' }, { id: 'letter', icon: Mail, label: 'Carta' }, { id: 'postit', icon: StickyNote, label: 'Post-it' }].map(type => (
                                <button key={type.id} onClick={() => setFormData(prev => ({ ...prev, type: type.id }))} className={`flex flex-col items-center p-3 rounded-lg border-2 transition-colors ${formData.type === type.id ? 'border-indigo-500 bg-indigo-50 text-indigo-700' : 'border-slate-100 text-slate-400 hover:bg-slate-50'}`}>
                                    <type.icon size={20} /><span className="text-xs font-bold mt-1">{type.label}</span>
                                </button>
                            ))}
                        </div>
                        <div><label className="text-xs font-bold text-slate-500 uppercase">Título</label><input type="text" value={formData.title} onChange={e => setFormData({...formData, title: e.target.value})} className="w-full text-lg font-bold border-b-2 border-slate-200 focus:border-indigo-400 outline-none py-1 text-slate-800 placeholder-slate-300" placeholder={formData.type === 'letter' ? "Assunto da carta..." : "Título da memória"}/></div>
                        <div className="grid grid-cols-2 gap-4">
                            <div><label className="text-xs font-bold text-slate-500 uppercase">Data</label><input type="date" value={formData.date} onChange={e => setFormData({...formData, date: e.target.value})} className="w-full border rounded px-2 py-1 text-slate-600 outline-none focus:border-indigo-400"/></div>

        // --- Timeline Dinâmica Componente ---
        const TimelineSection = ({ memories, onAddPhoto, onDeletePhoto }) => {
            const scrollRef = useRef(null);
            const [isDragging, setIsDragging] = useState(false);
            const [startX, setStartX] = useState(0);
            const [scrollLeft, setScrollLeft] = useState(0);
            const [selectedAlbum, setSelectedAlbum] = useState(null);

            const startYear = 2023;
            const currentYear = new Date().getFullYear();
            const currentMonth = new Date().getMonth();
            
            const monthNames = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];

            const timelineData = [];
            for (let y = startYear; y <= currentYear; y++) {
                let monthsInYear = [];
                const maxMonth = (y === currentYear) ? currentMonth : 11;

                for (let m = 0; m <= 11; m++) {
                    if (m > maxMonth) continue;
                    if (y === 2023 && m < 7) continue;
                    if (y === 2025 && m >= 3 && m <= 7) continue;

                    monthsInYear.push({ year: y, monthIndex: m, name: monthNames[m] });
                }
                
                if (monthsInYear.length > 0) {
                    timelineData.push({ year: y, months: monthsInYear });
                }
            }

            const handleMouseDown = (e) => {
                setIsDragging(true);
                setStartX(e.pageX - scrollRef.current.offsetLeft);
                setScrollLeft(scrollRef.current.scrollLeft);
            };
            const handleMouseLeave = () => setIsDragging(false);
            const handleMouseUp = () => setIsDragging(false);
            const handleMouseMove = (e) => {
                if (!isDragging) return;
                e.preventDefault();
                const x = e.pageX - scrollRef.current.offsetLeft;
                const walk = (x - startX) * 2;
                scrollRef.current.scrollLeft = scrollLeft - walk;
            };

            const handleTouchStart = (e) => {
                setIsDragging(true);
                setStartX(e.touches[0].pageX - scrollRef.current.offsetLeft);
                setScrollLeft(scrollRef.current.scrollLeft);
            };
            const handleTouchEnd = () => setIsDragging(false);
            const handleTouchMove = (e) => {
                if (!isDragging) return;
                const x = e.touches[0].pageX - scrollRef.current.offsetLeft;
                const walk = (x - startX) * 2;
                scrollRef.current.scrollLeft = scrollLeft - walk;
            };

            return (
                <div className="relative w-full py-10 z-20">
                    <div 
                        ref={scrollRef}
                        className="overflow-x-hidden cursor-grab active:cursor-grabbing px-4 md:px-10 py-10 select-none no-scrollbar touch-pan-x"
                        onMouseDown={handleMouseDown}
                        onMouseLeave={handleMouseLeave}
                        onMouseUp={handleMouseUp}
                        onMouseMove={handleMouseMove}
                        onTouchStart={handleTouchStart}
                        onTouchEnd={handleTouchEnd}
                        onTouchMove={handleTouchMove}

                        <div className="flex gap-10 md:gap-20 w-max items-start pt-10">

                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            ))}

                        memories={memories}
                        onAddPhoto={onAddPhoto}

                            <div className="flex items-center justify-center gap-3 mb-10 md:mb-16 text-orange-900/80">
                                <Leaf size={24} />
                                <h2 className="text-3xl md:text-5xl font-bold" style={fonts.romantic}>Nossas Estações</h2>
                            </div>
                            <p className="text-center max-w-2xl mx-auto mb-8 md:mb-12 text-orange-700 text-base md:text-lg" style={fonts.hand}>"Navegue pela nossa linha do tempo e reviva cada mês especial. Clique nos meses para abrir o álbum."</p>
                            <TimelineSection memories={memories} onAddPhoto={handleAddFromAlbum} onDeletePhoto={handleDelete} />
                        </div>
                        <div className="absolute bottom-0 left-0 w-full h-[150px] md:h-[200px] overflow-hidden leading-none z-0 pointer-events-none">
                            <div className="absolute inset-0 bg-gradient-to-t from-[#1e1b4b] via-[#4338ca] to-transparent opacity-90"></div>
                            {[...Array(15)].map((_, i) => (<div key={i} className="absolute bg-yellow-100 rounded-full animate-float" style={{width: Math.random()*4+1+'px', height: Math.random()*4+1+'px', bottom: Math.random()*50+'%', left: Math.random()*100+'%', opacity: Math.random(), animationDuration: Math.random()*5+5+'s', animationDelay: Math.random()*2+'s'}} />))}
                            <svg className="absolute bottom-0 w-full h-full" preserveAspectRatio="none" viewBox="0 0 1200 120">
                                <path d="M0,0V46.29c47.79,22.2,103.59,32.17,158,28,70.36-5.37,136.33-33.31,206.8-37.5C438.64,32.43,512.34,53.67,583,72.05c69.27,18,138.3,24.88,209.4,13.08,36.15-6,69.85-17.84,104.45-29.34C989.49,25,1113-14.29,1200,52.47V0Z" fill="#1e1b4b" opacity="0.2"></path>
                                <path d="M0,0V15.81C13,36.92,27.64,56.86,47.69,72.05,99.41,111.27,165,111,224.58,91.58c31.15-10.15,60.09-26.07,89.67-39.8,40.92-19,84.73-46,130.83-49.67,36.26-2.85,70.9,9.42,98.6,31.56,31.77,25.39,62.32,62,103.63,73,40.44,10.79,81.35-6.69,119.13-24.28s75.16-39,116.92-43.05c59.73-5.85,113.28,22.88,168.9,38.84,30.2,8.66,59,6.17,87.09-7.5,22.43-10.89,48-26.93,60.65-49.24V0Z" fill="#1e1b4b" opacity="0.5"></path>
                                <path d="M0,120 L0,100 Q150,150 300,100 T600,100 T900,100 T1200,80 L1200,120 Z" fill="#1e1b4b"></path>
                            </svg>
                            <div className="absolute bottom-16 md:bottom-24 left-1/2 -translate-x-1/2 animate-bounce-slow" style={{animationDelay: '2s'}}><MiniJellyfish className="text-indigo-200 drop-shadow-[0_0_15px_rgba(199,210,254,0.5)] opacity-90" /></div>
                        </div>
                    </section>

                    <section className="bg-[#1e1b4b] min-h-[80vh] py-16 md:py-24 text-white relative z-10">
                        <div className="container mx-auto px-4 max-w-5xl">
                            <div className="flex items-center justify-center gap-3 mb-10 md:mb-16 text-indigo-200">
                                <Moon size={24} />
                                <h2 className="text-3xl md:text-5xl font-bold" style={fonts.romantic}>Nossos Sonhos</h2>
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-8">
                                {future.length === 0 ? (<div className="text-center text-indigo-400 opacity-50 col-span-full" style={fonts.hand}>Ainda não sonhamos com o amanhã? Adicione algo!</div>) : future.map(item => (<div key={item.id} className="relative group"><CardRenderer item={item} onEdit={setEditingItem} onDelete={handleDelete} /></div>))}
                            </div>
                        </div>
                        <footer className="mt-20 md:mt-32 text-center text-indigo-400 pb-8 px-4" style={fonts.hand}>
                            <p>Feito com ❤️ para Lara Isabely</p>
                            <p className="text-xs mt-2 opacity-50">Sempre será dia 02.</p>
                        </footer>
                    </section>

                    <MemoryModal isOpen={isModalOpen} onClose={() => setIsModalOpen(false)} onSave={handleSave} editingItem={editingItem} />
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<MuseumApp />);
    </script>
</body>
